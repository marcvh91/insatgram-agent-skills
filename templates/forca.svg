<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000">
<defs>
  <linearGradient id="met" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6B7782"/><stop offset=".35" stop-color="#C9D2D9"/><stop offset=".55" stop-color="#8C98A2"/><stop offset="1" stop-color="#3C454D"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E252B"/><stop offset=".45" stop-color="#3A444C"/><stop offset="1" stop-color="#151A1F"/></linearGradient>
  <radialGradient id="kb" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#4B5660"/><stop offset=".6" stop-color="#232A31"/><stop offset="1" stop-color="#11161A"/></radialGradient>
  <radialGradient id="spot" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#D4FF3F" stop-opacity=".18"/><stop offset="1" stop-color="#D4FF3F" stop-opacity="0"/></radialGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<circle cx="540" cy="470" r="460" fill="url(#spot)"/>
<ellipse cx="540" cy="800" rx="420" ry="40" fill="#000" opacity=".45"/>
<!-- kettlebell -->
<g filter="url(#sh)" transform="translate(690,430)">
  <path d="M-95 -40 C -95 -170, 95 -170, 95 -40" fill="none" stroke="#2A3239" stroke-width="44" stroke-linecap="round"/>
  <path d="M-95 -40 C -95 -170, 95 -170, 95 -40" fill="none" stroke="#56626C" stroke-width="12" stroke-linecap="round" opacity=".7" transform="translate(-6,-8)"/>
  <ellipse cx="0" cy="110" rx="190" ry="185" fill="url(#kb)"/>
  <rect x="-120" y="270" width="240" height="30" rx="12" fill="#151A1F"/>
  <text x="0" y="140" text-anchor="middle" font-family="Inter" font-weight="900" font-size="90" fill="#D4FF3F" opacity=".9">16</text>
  <text x="0" y="185" text-anchor="middle" font-family="Inter" font-weight="800" font-size="34" fill="#9AA8B2" letter-spacing="4">KG</text>
</g>
<!-- dumbbell -->
<g filter="url(#sh)" transform="translate(360,640) rotate(-14)">
  <rect x="-190" y="-22" width="380" height="44" rx="10" fill="url(#met)"/>
  <g fill="url(#plate)">
    <rect x="-200" y="-140" width="62" height="280" rx="18"/><rect x="138" y="-140" width="62" height="280" rx="18"/>
    <rect x="-262" y="-110" width="56" height="220" rx="16"/><rect x="206" y="-110" width="56" height="220" rx="16"/>
  </g>
  <rect x="-286" y="-26" width="26" height="52" rx="8" fill="url(#met)"/><rect x="260" y="-26" width="26" height="52" rx="8" fill="url(#met)"/>
  <g stroke="#0E1216" stroke-width="3" opacity=".6"><line x1="-120" y1="-22" x2="-120" y2="22"/><line x1="-90" y1="-22" x2="-90" y2="22"/><line x1="-60" y1="-22" x2="-60" y2="22"/><line x1="60" y1="-22" x2="60" y2="22"/><line x1="90" y1="-22" x2="90" y2="22"/><line x1="120" y1="-22" x2="120" y2="22"/></g>
  <!-- price tag NOU -->
  <path d="M0 22 C 4 60, -10 80, -6 104" fill="none" stroke="#C9D2D9" stroke-width="3"/>
  <g transform="translate(-6,104) rotate(14)">
    <path d="M-70 0 L 70 0 L 70 70 L -70 70 Z" fill="#D4FF3F"/>
    <circle cx="0" cy="12" r="6" fill="#0B0F12"/>
    <text x="0" y="56" text-anchor="middle" font-family="Inter" font-weight="900" font-size="34" fill="#0B0F12">NOU</text>
  </g>
</g>
</svg>
