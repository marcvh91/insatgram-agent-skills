<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#4E6B78"/><stop offset="1" stop-color="#1B2830"/></radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF4E4"/><stop offset=".6" stop-color="#E9DDC2"/><stop offset="1" stop-color="#C9B994"/></linearGradient>
  <radialGradient id="boneR" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFF9EC"/><stop offset=".7" stop-color="#E6D8BA"/><stop offset="1" stop-color="#BFAE88"/></radialGradient>
  <linearGradient id="mus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8806A"/><stop offset="1" stop-color="#B9432F"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF3B1F" stop-opacity=".85"/><stop offset=".5" stop-color="#FF5A2A" stop-opacity=".35"/><stop offset="1" stop-color="#FF5A2A" stop-opacity="0"/></radialGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFEAF3" stop-opacity=".22"/><stop offset=".5" stop-color="#CFEAF3" stop-opacity=".06"/><stop offset="1" stop-color="#CFEAF3" stop-opacity=".22"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="900" height="520" fill="url(#bg)"/>
<!-- body silhouette -->
<path d="M250 0 C 245 70, 230 120, 190 210 C 160 280, 175 360, 215 420 L 238 520 L 432 520 L 440 470 L 460 470 L 468 520 L 662 520 L 685 420 C 725 360, 740 280, 710 210 C 670 120, 655 70, 650 0 Z" fill="url(#skin)" stroke="#DDF2F8" stroke-opacity=".35" stroke-width="3"/>
<g filter="url(#sh)">
<!-- lumbar vertebrae -->
<g fill="url(#bone)">
  <rect x="380" y="-8" width="140" height="10" rx="5"/>
  <rect x="408" y="8" width="84" height="38" rx="12"/><path d="M408 22 L355 14 L352 30 L408 36Z"/><path d="M492 22 L545 14 L548 30 L492 36Z"/>
  <rect x="404" y="62" width="92" height="40" rx="12"/><path d="M404 76 L345 70 L342 88 L404 92Z"/><path d="M496 76 L555 70 L558 88 L496 92Z"/>
  <rect x="400" y="118" width="100" height="40" rx="12"/>
</g>
<g fill="#8FA3B0" opacity=".9"><rect x="410" y="48" width="80" height="11" rx="5"/><rect x="406" y="104" width="88" height="11" rx="5"/></g>
<!-- iliac wings -->
<path d="M398 170 C 360 150, 300 120, 250 140 C 215 155, 205 210, 228 250 C 250 290, 300 320, 330 345 C 350 320, 372 290, 395 268 Z" fill="url(#boneR)"/>
<path d="M502 170 C 540 150, 600 120, 650 140 C 685 155, 695 210, 672 250 C 650 290, 600 320, 570 345 C 550 320, 528 290, 505 268 Z" fill="url(#boneR)"/>
<!-- sacrum -->
<path d="M392 160 L508 160 C 505 220, 485 280, 462 330 L 450 352 L 438 330 C 415 280, 395 220, 392 160Z" fill="url(#bone)"/>
<g fill="#A58F68" opacity=".75"><circle cx="425" cy="190" r="7"/><circle cx="475" cy="190" r="7"/><circle cx="430" cy="225" r="6"/><circle cx="470" cy="225" r="6"/><circle cx="436" cy="258" r="5"/><circle cx="464" cy="258" r="5"/></g>
<!-- ischium / pubis rings -->
<path fill-rule="evenodd" fill="url(#bone)" d="M330 340 C 300 360, 300 440, 345 460 C 385 478, 430 470, 440 440 C 445 410, 420 380, 395 350 Z M352 390 C 340 405, 345 435, 372 440 C 395 444, 405 425, 395 405 C 388 392, 365 382, 352 390 Z"/>
<path fill-rule="evenodd" fill="url(#bone)" d="M570 340 C 600 360, 600 440, 555 460 C 515 478, 470 470, 460 440 C 455 410, 480 380, 505 350 Z M548 390 C 560 405, 555 435, 528 440 C 505 444, 495 425, 505 405 C 512 392, 535 382, 548 390 Z"/>
