<g fill="url(#bone)">
  <circle cx="292" cy="352" r="34"/><path d="M300 360 L250 392 L262 420 L310 392Z"/><ellipse cx="248" cy="402" rx="26" ry="34"/>
  <path d="M234 420 L272 420 L262 520 L232 520 Z"/>
  <circle cx="608" cy="352" r="34"/><path d="M600 360 L650 392 L638 420 L590 392Z"/><ellipse cx="652" cy="402" rx="26" ry="34"/>
  <path d="M666 420 L628 420 L638 520 L668 520 Z"/>
</g>
</g>
<!-- glow -->
<circle cx="545" cy="318" r="120" fill="url(#glow)"/>
<!-- piriformis -->
<g>
  <path d="M488 230 C 520 240, 600 300, 640 360 L 618 378 C 580 340, 520 300, 470 292 Z" fill="url(#mus)" opacity=".95"/>
  <g stroke="#7E2516" stroke-opacity=".45" stroke-width="2" fill="none">
    <path d="M486 245 C 530 262, 590 310, 630 365"/><path d="M482 262 C 525 278, 585 320, 624 372"/><path d="M476 280 C 520 290, 575 325, 620 377"/>
  </g>
  <path d="M412 230 C 380 240, 300 300, 260 360 L 282 378 C 320 340, 380 300, 430 292 Z" fill="url(#mus)" opacity=".75"/>
</g>
<!-- sciatic nerve -->
<path d="M468 128 C 474 180, 482 230, 500 268 C 520 305, 548 330, 556 370 C 566 420, 572 470, 576 520" fill="none" stroke="#B88A00" stroke-width="22" stroke-linecap="round"/>
<path d="M468 128 C 474 180, 482 230, 500 268 C 520 305, 548 330, 556 370 C 566 420, 572 470, 576 520" fill="none" stroke="#F7D21E" stroke-width="16" stroke-linecap="round"/>
<path d="M466 128 C 472 180, 480 230, 497 268 C 517 305, 545 330, 553 370 C 563 420, 569 470, 573 520" fill="none" stroke="#FFF2A0" stroke-width="5" stroke-linecap="round" opacity=".8" filter="url(#soft)"/>
<!-- label -->
<line x1="580" y1="440" x2="700" y2="440" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="7 7"/>
<rect x="700" y="404" width="170" height="72" rx="16" fill="#0B0F12" opacity=".85"/>
<text x="785" y="436" fill="#D4FF3F" font-family="Inter" font-weight="900" font-size="26" text-anchor="middle">NERVI</text>
<text x="785" y="464" fill="#D4FF3F" font-family="Inter" font-weight="900" font-size="26" text-anchor="middle">CIÀTIC</text>
</svg>
