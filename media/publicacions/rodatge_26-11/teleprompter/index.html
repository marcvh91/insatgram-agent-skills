<title>Teleprompter Marc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap">
<style>
/* Teleprompter a pantalla completa: barra de control a dalt, text gran que puja sol, línia de lectura al terç superior */
:root{--bg:#000;--panel:#12181C;--line:#263038;--fg:#F4F6F7;--mute:#8B969D;--lime:#D4FF3F;--font:Inter,system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar.hide{display:none}
button,select{font:inherit;font-weight:800;font-size:15px;color:var(--fg);background:#1C242A;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
button.go{background:var(--lime);color:#0B0F12;border-color:var(--lime)}
button:focus-visible,select:focus-visible{outline:2px solid var(--lime)}
.grp{display:flex;gap:6px;align-items:center}
.lbl{font-size:12px;color:var(--mute);font-weight:600}
.val{min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:800}
#stage{position:fixed;inset:0;overflow:hidden}
#scroll{position:absolute;left:0;right:0;top:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));will-change:transform}
#stage.mirror #scroll{transform-origin:center}
.act{color:var(--lime);font-size:.45em;font-weight:600;line-height:1.3;margin:0 0 .6em}
.say{font-weight:800;line-height:1.28;margin:0}
.end{color:var(--mute);font-size:.4em;margin-top:1.5em}
.guide{position:fixed;left:0;right:0;top:42%;height:0;border-top:2px dashed color-mix(in srgb,var(--lime) 45%,transparent);pointer-events:none;z-index:2}
#count{position:fixed;inset:0;display:grid;place-items:center;font-size:30vw;font-weight:800;color:var(--lime);z-index:4;pointer-events:none}
.tip{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0;text-align:center;color:var(--mute);font-size:12px;z-index:3;pointer-events:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#scroll{will-change:auto}}
</style>
<div class="bar" id="bar">
  <select id="reel" aria-label="Reel"></select>
  <div class="grp"><button id="prev" aria-label="Clip anterior">‹</button><select id="clip" aria-label="Clip"></select><button id="next" aria-label="Clip següent">›</button></div>
  <div class="grp"><span class="lbl">Velocitat</span><button id="sDown">−</button><span class="val" id="sVal"></span><button id="sUp">+</button></div>
  <div class="grp"><span class="lbl">Lletra</span><button id="fDown">A−</button><button id="fUp">A+</button></div>
  <button id="mir">Mirall</button>
  <button class="go" id="play">▶ Començar</button>
</div>
<div id="stage"><div id="scroll"></div></div>
<div class="guide"></div>
<div id="count" hidden></div>
<div class="tip" id="tip">Toca la pantalla per aturar o seguir</div>
<script>
const DATA = {"drop": {"name": "Drop", "clips": [{"id": "D1", "name": "Ganxo + portada", "say": "Tens molèsties al tendó d'Aquil·les o al genoll quan corres, i mai t'has parat a mirar el calçat?", "act": "Comença sense bamba. A «calçat», aixeca-la a l'altura del pit (no més avall: a sota hi va el títol). En acabar, 2 s quiet somrient de veritat amb la bamba: d'aquí trec la portada."}, {"id": "D3", "name": "Què és el drop", "say": "Això és el drop: la diferència d'altura entre el taló i la punta. I aquesta té un drop de __ mil·límetres.", "act": "Bamba de perfil a l'altura del pit. Assenyala el taló i després la punta. Mira abans quin drop té la bamba (a la web de la marca) i digues el número."}, {"id": "D4", "name": "Els 3 tipus (àudio)", "say": "N'hi ha de tres tipus. Zero drop: taló i punta a la mateixa altura. Drop baix: de quatre a sis mil·límetres. I drop alt: de vuit a dotze, el més habitual.", "act": "Grava-ho com un vídeo, al mateix lloc i amb el mateix micro, perquè soni igual. Dret i somrient mentre parles. Un punt més ràpid que l'altra vegada."}]}, "cint": {"name": "Cintilla", "clips": [{"id": "C1", "name": "Ganxo + portada", "say": "Et fa mal la cara externa del genoll quan corres? Pot ser la cintilla.", "act": "Entra corrent al pla, para't i parla amb la mà a la cara externa del genoll. Al final, 2 s somrient mirant a càmera (portada)."}, {"id": "C2", "name": "Què és", "say": "És una banda de teixit molt dura que baixa per la cara externa de la cuixa, des del maluc fins a sota del genoll.", "act": "Recorre amb la mà el lateral de la cuixa, del maluc al genoll, lentament."}, {"id": "C3", "name": "Qui hi tira", "say": "Hi tiren dos músculs: el tensor de la fàscia lata, per davant, i el gluti major, per darrere.", "act": "«Dos» amb els dits. Toca el davant del maluc i després el gluti (gira't una mica de costat)."}, {"id": "C4", "name": "On fa mal", "say": "El dolor surt aquí. Abans es pensava que fregava l'os. Avui sabem que més aviat comprimeix un teixit amb nervis que hi ha a sota.", "act": "Primer «El dolor surt aquí» al pla C (detall del genoll, el dit assenyala). La resta al pla A: frega les mans a «fregava» i prem el puny contra la mà a «comprimeix»."}, {"id": "C5", "name": "Per què", "say": "Per què? Sobretot per pujar massa de pressa els quilòmetres o la intensitat. I en corredores s'ha vist menys força al gluti mitjà.", "act": "Mà que puja ràpid a «massa de pressa». Mà al lateral del maluc a «gluti mitjà»."}, {"id": "C6", "name": "Què fer", "say": "Què fer? Estirar-la no l'allargarà. El que funciona és enfortir el maluc: als estudis, el dolor baixa en dues a vuit setmanes. I ajusta la càrrega uns dies.", "act": "Nega amb el cap a «no l'allargarà». Puny ferm a «enfortir». Dits a «dues a vuit»."}, {"id": "C7", "name": "Crida", "say": "Et fa mal la cara externa del genoll? Escriu-me i ho mirem.", "act": "Comença a 3 m i camina cap a càmera mentre parles. Para a 1,5 m i assenyala avall."}]}};
const $ = id => document.getElementById(id);
const st = {reel:'drop', i:0, speed:4, font:9, mirror:false, playing:false, y:0};
try{ Object.assign(st, JSON.parse(localStorage.getItem('tp')||'{}'), {playing:false, y:0}); }catch(e){}
const save = () => { try{ localStorage.setItem('tp', JSON.stringify({reel:st.reel,i:st.i,speed:st.speed,font:st.font,mirror:st.mirror})); }catch(e){} };
let wake=null, raf=null, last=0, timer=null;
function fillReels(){ $('reel').innerHTML = Object.entries(DATA).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join(''); $('reel').value=st.reel; }
function fillClips(){ const c=DATA[st.reel].clips; if(st.i>=c.length) st.i=0; $('clip').innerHTML=c.map((x,j)=>`<option value="${j}">${x.id} · ${x.name}</option>`).join(''); $('clip').value=st.i; }
function render(){
  const c = DATA[st.reel].clips[st.i];
  const s = $('scroll'); s.style.fontSize = (st.font*0.55)+'vh';
  s.innerHTML = `<p class="act">${c.id} · ${c.act}</p><p class="say">${c.say}</p><p class="end">— fi del clip —</p>`;
  st.y = 0; place(); $('sVal').textContent = st.speed; $('stage').classList.toggle('mirror', st.mirror);
  $('mir').textContent = st.mirror ? 'Mirall ✓' : 'Mirall'; save();
}
function startY(){ return window.innerHeight*0.55; }
function place(){ const s=$('scroll'); s.style.transform = `translateY(${startY()-st.y}px)` + (st.mirror?' scaleX(-1)':''); }
function step(t){ if(!st.playing) return; const dt=(t-last)/1000; last=t; st.y += dt*st.speed*12*(st.font/9); place();
  if(st.y > $('scroll').offsetHeight - window.innerHeight*0.05){ pause(); return; } raf=requestAnimationFrame(step); }
async function play(){ clearInterval(timer); $('bar').classList.add('hide'); $('tip').hidden=false;
  try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){}
  let n=3; const el=$('count'); el.hidden=false; el.textContent=n;
  timer=setInterval(()=>{ n--; if(n>0){el.textContent=n;} else { clearInterval(timer); el.hidden=true; st.playing=true; last=performance.now(); raf=requestAnimationFrame(step);} },800); }
function pause(){ clearInterval(timer); $('count').hidden=true; st.playing=false; cancelAnimationFrame(raf); $('bar').classList.remove('hide'); $('play').textContent = st.y>0 ? '▶ Seguir' : '▶ Començar'; }
$('stage').addEventListener('click', ()=>{ if(st.playing){ pause(); } else if(!$('bar').classList.contains('hide')){ play(); } });
$('play').onclick = play;
$('reel').onchange = e => { st.reel=e.target.value; st.i=0; fillClips(); render(); $('play').textContent='▶ Començar'; };
$('clip').onchange = e => { st.i=+e.target.value; render(); $('play').textContent='▶ Començar'; };
$('prev').onclick = () => { if(st.i>0){ st.i--; $('clip').value=st.i; render(); $('play').textContent='▶ Començar'; } };
$('next').onclick = () => { if(st.i<DATA[st.reel].clips.length-1){ st.i++; $('clip').value=st.i; render(); $('play').textContent='▶ Començar'; } };
$('sDown').onclick = () => { st.speed=Math.max(1,st.speed-1); $('sVal').textContent=st.speed; save(); };
$('sUp').onclick = () => { st.speed=Math.min(15,st.speed+1); $('sVal').textContent=st.speed; save(); };
$('fDown').onclick = () => { st.font=Math.max(5,st.font-1); render(); };
$('fUp').onclick = () => { st.font=Math.min(16,st.font+1); render(); };
$('mir').onclick = () => { st.mirror=!st.mirror; render(); };
addEventListener('resize', place);
fillReels(); fillClips(); render();
</script>
